name: Build Linux AppImage

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux-appimage:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            cmake \
            patchelf \
            desktop-file-utils \
            libgl1-mesa-dev \
            libopengl-dev \
            libegl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-xkb1 \
            libx11-xcb-dev \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libglib2.0-0 \
            libnss3 \
            libxcomposite1 \
            libxcursor1 \
            libxi6 \
            libxrender1 \
            libxtst6 \
            libasound2 \
            libpulse0 \
            libspeechd2 \
            libudev1

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtcharts qtquick3d qt5compat qtlocation qtpositioning qtsensors qtspeech qtmultimedia qtshadertools qtserialport qtconnectivity'
          cache: true

      - name: Install linuxdeployqt
        uses: miurahr/install-linuxdeployqt-action@v1.0.1

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          if [ -f build/AMarinerControl ]; then
            cp build/AMarinerControl AppDir/usr/bin/
          elif [ -f build/Release/AMarinerControl ]; then
            cp build/Release/AMarinerControl AppDir/usr/bin/
          else
            echo "AMarinerControl binary not found"
            find build -maxdepth 3 -type f -name "AMarinerControl" || true
            exit 1
          fi

          sed \
            -e 's|^Exec=.*|Exec=AMarinerControl|' \
            -e 's|^Icon=.*|Icon=amarinercontrol|' \
            -e 's|^Name=.*|Name=AMarinerControl|' \
            deploy/linux/org.mavlink.qgroundcontrol.desktop.in \
            > AppDir/usr/share/applications/amarinercontrol.desktop

          cp deploy/linux/AMarinerControl_256.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/amarinercontrol.png

      - name: Write qt.conf
        run: |
          cat > AppDir/usr/bin/qt.conf <<'EOF'
          [Paths]
          Plugins=plugins
          Qml2Imports=qml
          Imports=qml
          EOF

      - name: Build AppImage
        env:
          VERSION: "1.0.3"
        run: |
          linuxdeployqt AppDir/usr/share/applications/amarinercontrol.desktop \
            -qmake="$QT_ROOT_DIR/bin/qmake" \
            -qmldir="$GITHUB_WORKSPACE/src" \
            -bundle-non-qt-libs \
            -appimage

      - name: Collect AppImage
        run: |
          mkdir -p dist
          find . -name "*.AppImage" -exec cp {} dist/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMarinerControl-AppImage
          path: dist/*.AppImage
