name: Build Linux AppImage

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths:
      - '.github/workflows/appimage.yml'
      - '.github/actions/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'deploy/linux/**'
      - 'src/**'
      - 'tools/setup/*debian*'

permissions:
  contents: read

jobs:
  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-22.04

    defaults:
      run:
        shell: bash

    env:
      APP_NAME: AMarinerControl
      APPIMAGE_NAME: AMarinerControl-x86_64.AppImage
      BUILD_DIR: ${{ runner.temp }}/build
      QT_VERSION: 6.8.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Initial setup
        uses: ./.github/actions/common

      - name: Install Linux dependencies
        run: |
          chmod a+x ./tools/setup/install-dependencies-debian.sh
          sudo ./tools/setup/install-dependencies-debian.sh

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}
          modules: qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors
          setup-python: false
          cache: true

      - name: Configure
        run: |
          "${QT_ROOT_DIR}/bin/qt-cmake" -S "${GITHUB_WORKSPACE}" -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQGC_BUILD_TESTING=OFF

      - name: Build
        run: cmake --build "${BUILD_DIR}" --config Release --parallel

      - name: Smoke test executable
        run: xvfb-run -a "${BUILD_DIR}/Release/${APP_NAME}" --simple-boot-test

      - name: Package AppImage
        run: cmake --install "${BUILD_DIR}" --config Release

      - name: Smoke test AppImage
        run: xvfb-run -a "${BUILD_DIR}/${APPIMAGE_NAME}" --simple-boot-test

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-AppImage
          path: ${{ env.BUILD_DIR }}/${{ env.APPIMAGE_NAME }}
          if-no-files-found: error
