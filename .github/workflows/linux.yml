name: Build Linux AppImage

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux-appimage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          ALSA_PKG=libasound2
          if apt-cache show libasound2t64 >/dev/null 2>&1; then
            ALSA_PKG=libasound2t64
          fi

          sudo apt-get install -y \
            build-essential \
            ninja-build \
            cmake \
            patchelf \
            desktop-file-utils \
            libgl1-mesa-dev \
            libopengl-dev \
            libegl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-xkb1 \
            libx11-xcb-dev \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libglib2.0-0 \
            libnss3 \
            libxcomposite1 \
            libxcursor1 \
            libxi6 \
            libxrender1 \
            libxtst6 \
            $ALSA_PKG \
            libpulse0 \
            libspeechd2 \
            libudev1

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtcharts qtquick3d qt5compat qtlocation qtpositioning qtsensors qtspeech qtmultimedia qtshadertools qtserialport qtconnectivity'
          use-official: true
          email: ${{ secrets.QT_EMAIL }}
          pw: ${{ secrets.QT_PW }}
          cache: true

      - name: Configure CMake
        run: |
          cmake -S . -B build/Desktop_Qt_6_8_3-Release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build/Desktop_Qt_6_8_3-Release -j$(nproc)

      - name: Generate CPack package
        run: |
          cmake --build build/Desktop_Qt_6_8_3-Release --target package -j$(nproc)

      - name: Locate AppDir
        id: appdir
        shell: bash
        run: |
          cd build/Desktop_Qt_6_8_3-Release
          APPDIR="$(find _CPack_Packages/Linux/TGZ -maxdepth 2 -type d -name 'AMarinerControl-*-Linux' | head -n 1)"
          if [ -z "$APPDIR" ]; then
            echo "AppDir not found"
            find _CPack_Packages -maxdepth 4 -type d || true
            exit 1
          fi
          echo "appdir=$PWD/$APPDIR" >> "$GITHUB_OUTPUT"

      - name: Create AppRun
        shell: bash
        run: |
          APPDIR="${{ steps.appdir.outputs.appdir }}"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"

          export PATH="$HERE/bin:$PATH"
          export LD_LIBRARY_PATH="$HERE/lib:${LD_LIBRARY_PATH:-}"
          export QT_PLUGIN_PATH="$HERE/plugins:${QT_PLUGIN_PATH:-}"
          export QML2_IMPORT_PATH="$HERE/qml:${QML2_IMPORT_PATH:-}"

          exec "$HERE/bin/AMarinerControl" "$@"
          EOF

          chmod +x "$APPDIR/AppRun"

      - name: Create desktop file
        shell: bash
        run: |
          APPDIR="${{ steps.appdir.outputs.appdir }}"
          APP=AMarinerControl

          cat > "$APPDIR/$APP.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=$APP
          Exec=$APP
          Icon=$APP
          Terminal=false
          Categories=Utility;
          EOF

      - name: Add root icon
        shell: bash
        run: |
          APPDIR="${{ steps.appdir.outputs.appdir }}"
          APP=AMarinerControl

          cp -f "$APPDIR/share/icons/hicolor/256x256/apps/$APP.png" "$APPDIR/$APP.png" 2>/dev/null || true
          ln -sf "$APP.png" "$APPDIR/.DirIcon"

      - name: Build AppImage
        shell: bash
        run: |
          cd build/Desktop_Qt_6_8_3-Release
          APPDIR="$(find _CPack_Packages/Linux/TGZ -maxdepth 2 -type d -name 'AMarinerControl-*-Linux' | head -n 1)"
          ARCH=x86_64 VERSION=1.3 \
            _CPack_Packages/Linux/TGZ/tools/appimagetool-x86_64.AppImage \
            "$APPDIR" "AMarinerControl-x86_64.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMarinerControl-AppImage
          path: build/Desktop_Qt_6_8_3-Release/*.AppImage
