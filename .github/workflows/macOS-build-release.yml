name: Build macOS Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      QT_VERSION: 6.8.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install aqtinstall
        run: python3 -m pip install --upgrade pip wheel setuptools aqtinstall

      - name: List available Qt modules
        run: python3 -m aqt list-qt mac desktop --modules $QT_VERSION clang_64

      - name: Install Qt
        run: |
          python3 -m aqt install-qt mac desktop $QT_VERSION clang_64 \
            --outputdir $HOME/Qt \
            --modules qtwebengine,qtpdf

      - name: Configure project
        run: cmake -B build -DCMAKE_PREFIX_PATH=$HOME/Qt/$QT_VERSION/macos -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build --config Release

      - name: Package app
        run: macdeployqt build/Release/AMarinerControl.app

      - name: Archive DMG
        run: hdiutil create -volname AMarinerControl -srcfolder build/Release/AMarinerControl.app -ov -format UDZO AMarinerControl.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMarinerControl-macOS
          path: AMarinerControl.dmg
