name: macOS Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-macos:
    runs-on: macos-latest

    env:
      QT_VERSION: 6.8.3
      QT_OUTPUT: ${{ github.workspace }}/Qt
      BUILD_DIR: ${{ github.workspace }}/build-macos

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Homebrew dependencies
      run: |
        brew update
        brew install p7zip cmake ninja python

    - name: Set up Python and pip
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install aqtinstall and dependencies
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install aqtinstall==3.1.* py7zr==1.0.0

    - name: Install Qt 6.8.3 with required modules
      run: |
        python3 -m aqt install-qt mac desktop $QT_VERSION clang_64 \
          --outputdir $QT_OUTPUT \
          --modules charts quick3d location multimedia svg serialport texttospeech

    - name: Configure CMake
      run: |
        cmake -B $BUILD_DIR \
          -DCMAKE_PREFIX_PATH=$QT_OUTPUT/$QT_VERSION/macos \
          -DCMAKE_BUILD_TYPE=Release \
          -GNinja

    - name: Build QGroundControl
      run: |
        cmake --build $BUILD_DIR --config Release

    - name: Deploy macOS app
      run: |
        $QT_OUTPUT/$QT_VERSION/macos/bin/macdeployqt \
          $BUILD_DIR/Release/AMarinerControl.app \
          -dmg

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: AMarinerControl-macOS
        path: $BUILD_DIR/Release/AMarinerControl.dmg
