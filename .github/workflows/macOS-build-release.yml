name: Build macOS Release

on:
  push:
    branches:
      - master
  pull_request:

env:
  QT_VERSION: 6.8.3
  QT_DIR: $RUNNER_TEMP/Qt

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install aqtinstall==3.1.*

      - name: Install Qt
        run: |
          python3 -m aqt install-qt mac desktop $QT_VERSION clang_64 \
            --outputdir $QT_DIR \
            --modules qtcharts qtquick3d qtmultimedia qtlocation qtserialport qtsvg qttexttospeech qtwebengine qtpdf

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH=$QT_DIR/$QT_VERSION/clang_64/lib/cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release -- -j$(sysctl -n hw.ncpu)

      - name: Bundle Qt for macOS
        run: |
          $QT_DIR/$QT_VERSION/clang_64/bin/macdeployqt build/Release/YourApp.app

      - name: Create DMG
        run: |
          hdiutil create -volname YourApp -srcfolder build/Release/YourApp.app \
          -ov -format UDZO build/Release/YourApp.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG
          path: build/Release/YourApp.dmg
