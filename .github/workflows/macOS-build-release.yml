name: Build macOS Release

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-macos:
    runs-on: macos-latest

    env:
      QT_VERSION: 6.8.3
      BUILD_DIR: build-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          brew install p7zip
          python3 -m pip install --upgrade pip setuptools wheel py7zr aqtinstall

      - name: List available Qt modules
        run: |
          python3 -m aqt list-qt mac desktop --modules $QT_VERSION clang_64

      - name: Install Qt (via aqtinstall)
        run: |
          python3 -m aqt install-qt mac desktop $QT_VERSION clang_64 \
          --outputdir $HOME/Qt \
          --modules qt3d qt5compat qtcharts qtconnectivity qtdatavis3d qtgraphs qtgrpc qthttpserver qtimageformats qtlanguageserver qtlocation qtlottie qtmultimedia qtnetworkauth qtpdf qtpositioning qtquick3d qtquick3dphysics qtquickeffectmaker qtquicktimeline qtremoteobjects qtscxml qtsensors qtserialbus qtserialport qtshadertools qtspeech qtvirtualkeyboard qtwebchannel qtwebengine qtwebsockets qtwebview

      - name: Install GStreamer (Homebrew)
        run: |
          brew update
          brew install gstreamer gst-plugins-base gst-plugins-good pkg-config

      - name: Install QGC build dependencies
        run: |
          brew install cmake ninja

      - name: Configure CMake
        run: |
          mkdir -p $BUILD_DIR
          cmake -B $BUILD_DIR -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/$QT_VERSION/macos/lib/cmake/Qt6" 
      - name: Build
        run: |
          cmake --build $BUILD_DIR --config Release --parallel 2

      - name: Package .app bundle
        run: |
          APP_NAME="AMarinerControl.app"
          APP_PATH=$(find $BUILD_DIR -name "$APP_NAME" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ $APP_NAME not found!"
            exit 1
          fi
          echo "Found app at $APP_PATH"
          cd $(dirname "$APP_PATH")
          zip -r AMarinerControl-macOS.zip "$APP_NAME"
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMarinerControl-macOS
          path: $BUILD_DIR/Release/AMarinerControl-macOS.zip
