name: macOS Build and Release

on:
  push:
    tags:
      - "v*"    # Runs on version tags like v1.0.0
  workflow_dispatch:   # Allows manual trigger

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6.8.3 with required modules
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'charts,quick3d,location,multimedia,svg,serialport,texttospeech'

      - name: Show Qt path
        run: |
          echo "Qt6_DIR=$Qt6_DIR"
          ls -l $Qt6_DIR/lib/cmake

      - name: Build with CMake
        run: |
          cmake -B build -DCMAKE_PREFIX_PATH=$Qt6_DIR -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Rename .app bundle
        run: |
          APP_PATH="build/Release/QGroundControl.app"
          TARGET_APP="build/Release/AMarinerControl.app"
          if [ -d "$APP_PATH" ]; then
            mv "$APP_PATH" "$TARGET_APP"
          else
            echo "ERROR: .app bundle not found at $APP_PATH"
            exit 1
          fi

      - name: Run macdeployqt to create DMG
        run: |
          APP_BUNDLE="build/Release/AMarinerControl.app"
          if [ -d "$APP_BUNDLE" ]; then
            macdeployqt "$APP_BUNDLE" -dmg
          else
            echo "ERROR: Cannot run macdeployqt, app bundle missing"
            exit 1
          fi

      - name: List Release folder
        run: |
          echo "Contents of build/Release:"
          ls -l build/Release

      - name: Find DMG
        id: find_dmg
        run: |
          DMG_FILE=$(ls build/Release/*.dmg | head -n 1)
          if [ -z "$DMG_FILE" ]; then
            echo "ERROR: No DMG found"
            exit 1
          fi
          echo "DMG_FILE=$DMG_FILE" >> $GITHUB_ENV

      - name: Upload DMG as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMarinerControl-macOS
          path: ${{ env.DMG_FILE }}

      - name: Create GitHub Release and Upload DMG
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
