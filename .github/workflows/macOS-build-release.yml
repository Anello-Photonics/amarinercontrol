name: Build macOS Installer

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      QT_VERSION: 6.8.3
      QT_DIR: ${{ runner.temp }}/Qt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install aqtinstall==3.1.*

      - name: List available Qt modules
        run: |
          python3 -m aqt list-qt mac desktop $QT_VERSION clang_64

      - name: Install Qt with required modules
        run: |
          python3 -m aqt install-qt mac desktop $QT_VERSION clang_64 \
            --outputdir $QT_DIR \
            --modules qtcharts,qtquick3d,qtmultimedia,qtlocation,qtserialport,qtsvg,qttexttospeech,qtwebengine,qtpdf

      - name: Configure project
        run: |
          cmake -B build -S . \
            -DCMAKE_PREFIX_PATH=$QT_DIR/$QT_VERSION/macos \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: |
          cmake --build build --config Release -- -j$(sysctl -n hw.ncpu)

      - name: Deploy macOS app
        run: |
          macdeployqt build/Release/QGroundControl.app -dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: QGroundControl-macOS
          path: build/Release/QGroundControl.dmg
