name: Windows Installer

on:
  push:
    branches:
      - master
      - 'Stable*'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths:
      - 'deploy/windows/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'

jobs:
  build-installer:
    runs-on: windows-latest

    env:
      APP_NAME: AMarinerControl
      BUILD_DIR: ${{ github.workspace }}/build-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NSIS
        uses: burnett/NSIS-action@v1
        with:
          nsis-version: latest

      - name: Build project
        shell: pwsh
        run: |
          mkdir -Force $env:BUILD_DIR
          # Adjust your build command if using CMake
          cmake -S . -B $env:BUILD_DIR -DCMAKE_BUILD_TYPE=Release
          cmake --build $env:BUILD_DIR --config Release

      - name: Create Windows Installer
        shell: pwsh
        run: |
          Write-Host "Building NSIS installer..."
          & "C:\Program Files (x86)\NSIS\makensis.exe" "$PWD\deploy\windows\QGroundControlInstaller.nsi"

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Windows-Installer
          path: "$PWD/deploy/windows/Output/${{ env.APP_NAME }}Installer.exe"
