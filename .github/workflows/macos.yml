name: Build macOS DMG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos-dmg:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtcharts qtquick3d qt5compat qtlocation qtpositioning qtsensors qtspeech qtmultimedia qtshadertools qtserialport qtconnectivity'
          cache: true

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        shell: bash
        run: |
          cmake --build build --config Release

      - name: Locate app bundle
        id: app
        shell: bash
        run: |
          APP_PATH="$(find "$GITHUB_WORKSPACE/build" -maxdepth 3 -name "AMarinerControl.app" | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "AMarinerControl.app not found"
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Deploy Qt and create DMG
        shell: bash
        run: |
          "$QT_ROOT_DIR/bin/macdeployqt" "${{ steps.app.outputs.app_path }}" \
            -qmldir="$GITHUB_WORKSPACE/src" \
            -dmg

      - name: Collect DMG
        shell: bash
        run: |
          mkdir -p dist
          find "$GITHUB_WORKSPACE/build" -name "*.dmg" -exec cp {} dist/ \;

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMarinerControl-macOS-DMG
          path: dist/*.dmg
