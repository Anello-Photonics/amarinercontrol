name: Build macOS DMG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos-dmg:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtcharts qtquick3d qt5compat qtlocation qtpositioning qtsensors qtspeech qtmultimedia qtshadertools qtserialport qtconnectivity'
          cache: true

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        shell: bash
        run: |
          cmake --build build --config Release

      - name: Locate real app bundle
        id: app
        shell: bash
        run: |
          CANDIDATES=(
            "$GITHUB_WORKSPACE/build/Qt_6_8_3_for_macOS-Release/Release/AMarinerControl.app"
            "$GITHUB_WORKSPACE/build/Release/AMarinerControl.app"
            "$GITHUB_WORKSPACE/build/AMarinerControl.app"
          )

          REAL_APP=""
          for app in "${CANDIDATES[@]}"; do
            if [ -f "$app/Contents/Info.plist" ] && [ -d "$app/Contents/MacOS" ]; then
              REAL_APP="$app"
              break
            fi
          done

          if [ -z "$REAL_APP" ]; then
            mapfile -t APPS < <(find "$GITHUB_WORKSPACE/build" -name "AMarinerControl.app" -type d | awk '{ print length, $0 }' | sort -n | cut -d" " -f2-)

            echo "Fallback search results:"
            printf '%s\n' "${APPS[@]}"

            for app in "${APPS[@]}"; do
              if [ -f "$app/Contents/Info.plist" ] && [ -d "$app/Contents/MacOS" ]; then
                REAL_APP="$app"
              fi
            done
          fi

          if [ -z "$REAL_APP" ]; then
            echo "No valid app bundle found"
            exit 1
          fi

          BUILD_QML_DIR=""
          if [ -d "$GITHUB_WORKSPACE/build/Qt_6_8_3_for_macOS-Release/qml" ]; then
            BUILD_QML_DIR="$GITHUB_WORKSPACE/build/Qt_6_8_3_for_macOS-Release/qml"
          else
            BUILD_QML_DIR="$(find "$GITHUB_WORKSPACE/build" -type d -name qml | head -n 1 || true)"
          fi

          echo "Using app: $REAL_APP"
          echo "Using build qml dir: $BUILD_QML_DIR"

          echo "app_path=$REAL_APP" >> "$GITHUB_OUTPUT"
          echo "build_qml_dir=$BUILD_QML_DIR" >> "$GITHUB_OUTPUT"

      - name: Stage app bundle
        id: stage
        shell: bash
        run: |
          STAGE_DIR="$GITHUB_WORKSPACE/dist/macos"
          mkdir -p "$STAGE_DIR"
          rm -rf "$STAGE_DIR/AMarinerControl.app"
          cp -R "${{ steps.app.outputs.app_path }}" "$STAGE_DIR/"
          echo "stage_app=$STAGE_DIR/AMarinerControl.app" >> "$GITHUB_OUTPUT"

      - name: Inspect staged app before deploy
        shell: bash
        run: |
          APP="${{ steps.stage.outputs.stage_app }}"
          ls -la "$APP/Contents"
          ls -la "$APP/Contents/MacOS"
          cat "$APP/Contents/Info.plist" >/dev/null

      - name: Deploy Qt and create DMG
        shell: bash
        run: |
          APP="${{ steps.stage.outputs.stage_app }}"

          CMD=(
            "$QT_ROOT_DIR/bin/macdeployqt"
            "$APP"
            "-qmldir=$GITHUB_WORKSPACE/src"
            "-qmldir=$QT_ROOT_DIR/qml"
            "-dmg"
            "-verbose=2"
          )

          if [ -n "${{ steps.app.outputs.build_qml_dir }}" ]; then
            CMD+=("-qmldir=${{ steps.app.outputs.build_qml_dir }}")
          fi

          "${CMD[@]}"

      - name: Inspect staged app after deploy
        shell: bash
        run: |
          APP="${{ steps.stage.outputs.stage_app }}"
          ls -la "$APP/Contents"
          ls -la "$APP/Contents/MacOS"
          ls -la "$APP/Contents/Frameworks"
          ls -la "$APP/Contents/PlugIns"
          ls -la "$APP/Contents/Resources"

      - name: Collect DMG
        shell: bash
        run: |
          mkdir -p dist
          find "$GITHUB_WORKSPACE/dist/macos" -name "*.dmg" -exec cp {} dist/ \;

      - name: Zip staged app
        shell: bash
        run: |
          APP="${{ steps.stage.outputs.stage_app }}"
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/AMarinerControl.app.zip

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMarinerControl-macOS-DMG
          path: dist/*.dmg

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMarinerControl-macOS-app
          path: dist/AMarinerControl.app.zip
