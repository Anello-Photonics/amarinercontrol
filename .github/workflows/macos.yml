name: MacOS

on:
  push:
    branches:
      - master
      - 'Stable*'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths:
      - '.github/workflows/macos.yml'
      - 'deploy/macos/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'

jobs:
  build:
    runs-on: macos-latest

    strategy:
      matrix:
        BuildType: [Release]

    defaults:
      run:
        shell: bash

    env:
      QT_VERSION: 6.8.3
      APP_NAME: AMarinerControl

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          fetch-tags: true

      - name: Install Dependencies (include GStreamer)
        run: |
          brew update
          brew install gstreamer gst-plugins-base gst-plugins-good cmake ninja create-dmg

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          dir: ${{ runner.temp }}
          modules: qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors
          setup-python: false
          cache: true

      # - name: Import Code Signing Certificate
      #   if: github.event_name != 'pull_request'
      #   uses: apple-actions/import-codesign-certs@v5
      #   with:
      #     p12-file-base64: ${{ secrets.MACOS_SIGNING_CERTS_P12 }}
      #     p12-password: ${{ secrets.MACOS_SIGNING_CERTS_PASS }}

      - name: Configure
        run: |
          mkdir -p ${{ runner.temp }}/build
          ${{ env.QT_ROOT_DIR }}/bin/qt-cmake \
            -S ${{ github.workspace }} \
            -B ${{ runner.temp }}/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.BuildType }}

      - name: Build
        working-directory: ${{ runner.temp }}/build
        run: cmake --build . --target all --config ${{ matrix.BuildType }} --parallel

      # ✅ New Step: Run macdeployqt to include Qt frameworks
      - name: Deploy Qt frameworks and QML modules
        working-directory: ${{ runner.temp }}/build/${{ matrix.BuildType }}
        run: |
          QT_BIN_DIR="${{ env.QT_ROOT_DIR }}/bin"
          APP_PATH="${{ env.APP_NAME }}.app"
          QML_DIR="${{ github.workspace }}/src"  # adjust if your QML files are in a subfolder

          echo "Running macdeployqt with QML directory $QML_DIR ..."
          "$QT_BIN_DIR/macdeployqt" "$APP_PATH" -qmldir="$QML_DIR" -verbose=2

          echo "Manually copying missing QtQuick3D plugin if needed..."
          QT_QML_PATH="${{ env.QT_ROOT_DIR }}/qml"
          PLUGINS_DEST="$APP_PATH/Contents/PlugIns/qml"
          mkdir -p "$PLUGINS_DEST/QtQuick3D"
          cp -R "$QT_QML_PATH/QtQuick3D" "$PLUGINS_DEST/" || echo "⚠️ QtQuick3D not found, continuing"

          echo "✅ macdeployqt (with QML + QtQuick3D) finished successfully"

      - name: Ensure QtQuick3D is bundled
        run: |
          QT_DIR="/Users/runner/hostedtoolcache/Qt/6.5.3/macos"
          APP_QML_DIR="build/AMarinerControl.app/Contents/Resources/qml"
          mkdir -p "$APP_QML_DIR"
          cp -R "$QT_DIR/qml/QtQuick3D" "$APP_QML_DIR/" || true
          cp -R "$QT_DIR/qml/QtQuick" "$APP_QML_DIR/" || true
          cp -R "$QT_DIR/qml/QtQuick.Controls" "$APP_QML_DIR/" || true

      # (Optional) Verify the frameworks and library links
      - name: Verify Qt frameworks in app
        working-directory: ${{ runner.temp }}/build/${{ matrix.BuildType }}
        run: |
          echo "Listing bundled frameworks:"
          ls -la "${{ env.APP_NAME }}.app/Contents/Frameworks"
          echo "Checking library dependencies:"
          otool -L "${{ env.APP_NAME }}.app/Contents/MacOS/${{ env.APP_NAME }}"

      - name: Package .app
        working-directory: ${{ runner.temp }}/build/${{ matrix.BuildType }}
        run: |
          APP_PATH="${{ env.APP_NAME }}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ App bundle not found!"
            exit 1
          fi
          echo "✅ Found app at $APP_PATH"

      - name: Create DMG
        working-directory: ${{ runner.temp }}/build/${{ matrix.BuildType }}
        run: |
          create-dmg \
            --volname "${{ env.APP_NAME }}" \
            --window-size 500 300 \
            --icon-size 100 \
            --app-drop-link 250 150 \
            "${{ env.APP_NAME }}-macOS.dmg" \
            "${{ env.APP_NAME }}.app"
          echo "✅ DMG created at $(pwd)/${{ env.APP_NAME }}-macOS.dmg"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macOS
          path: ${{ runner.temp }}/build/${{ matrix.BuildType }}/${{ env.APP_NAME }}-macOS.dmg
