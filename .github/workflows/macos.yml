name: macOS

on:
  push:
    branches:
      - master
      - 'Stable*'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths:
      - '.github/workflows/macos.yml'
      - 'deploy/macos/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'

jobs:
  build:
    runs-on: macos-latest

    strategy:
      matrix:
        BuildType: [Release]

    defaults:
      run:
        shell: bash

    env:
      QT_VERSION: 6.8.3
      APP_NAME: AMarinerControl
      APP_BUNDLE: AMarinerControl.app
      DMG_NAME: AMarinerControl-macOS.dmg
      QGC_MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          fetch-tags: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          dir: ${{ runner.temp }}
          modules: qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors
          setup-python: false
          cache: true

      - name: Install Dependencies
        run: |
          brew update
          brew install gstreamer gst-plugins-base gst-plugins-good cmake ninja create-dmg

      - name: Import Code Signing Certificate
        if: github.event_name != 'pull_request'
        uses: apple-actions/import-codesign-certs@v5
        with:
          p12-file-base64: ${{ secrets.MACOS_SIGNING_CERTS_P12 }}
          p12-password: ${{ secrets.MACOS_SIGNING_CERTS_PASS }}

      - name: Configure
        run: |
          mkdir -p build-macos
          cd build-macos
          ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -S .. -B . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.BuildType }}

      - name: Build
        run: |
          cmake --build build-macos --target all --config ${{ matrix.BuildType }} --parallel

      - name: Package .app into DMG
        run: |
          cd build-macos
          if [ ! -d "${{ env.APP_BUNDLE }}" ]; then
            echo "❌ ${APP_BUNDLE} not found!"
            exit 1
          fi
          create-dmg \
            --volname "${{ env.APP_NAME }}" \
            --volicon "../deploy/macos/${{ env.APP_NAME }}.icns" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            "${{ env.DMG_NAME }}" \
            "${{ env.APP_BUNDLE }}"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMarinerControl-macOS
          path: build-macos/${{ env.DMG_NAME }}
