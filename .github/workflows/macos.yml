name: Build macOS DMG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos-dmg:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtcharts qtquick3d qt5compat qtlocation qtpositioning qtsensors qtspeech qtmultimedia qtshadertools qtserialport qtconnectivity'
          cache: true

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        shell: bash
        run: |
          cmake --build build --config Release

      - name: Locate app bundle and qml dirs
        id: paths
        shell: bash
        run: |
          APP_PATH="$(find "$GITHUB_WORKSPACE/build" -maxdepth 6 -name "AMarinerControl.app" | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "AMarinerControl.app not found"
            exit 1
          fi

          BUILD_QML_DIR="$(find "$GITHUB_WORKSPACE/build" -maxdepth 5 -type d -name qml | head -n 1 || true)"

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "build_qml_dir=$BUILD_QML_DIR" >> "$GITHUB_OUTPUT"

      - name: Inspect app bundle before deploy
        shell: bash
        run: |
          APP_PATH="${{ steps.paths.outputs.app_path }}"
          echo "App path: $APP_PATH"
          ls -la "$APP_PATH"
          ls -la "$APP_PATH/Contents" || true
          ls -la "$APP_PATH/Contents/MacOS" || true
          ls -la "$APP_PATH/Contents/Frameworks" || true
          ls -la "$APP_PATH/Contents/PlugIns" || true
          ls -la "$APP_PATH/Contents/Resources" || true

      - name: Fail if bundle is incomplete before deploy
        shell: bash
        run: |
          APP_PATH="${{ steps.paths.outputs.app_path }}"
          test -f "$APP_PATH/Contents/Info.plist"
          test -d "$APP_PATH/Contents/MacOS"

      - name: Deploy Qt and create DMG
        shell: bash
        run: |
          APP_PATH="${{ steps.paths.outputs.app_path }}"

          CMD=(
            "$QT_ROOT_DIR/bin/macdeployqt"
            "$APP_PATH"
            "-qmldir=$GITHUB_WORKSPACE/src"
            "-qmldir=$QT_ROOT_DIR/qml"
            "-dmg"
            "-verbose=2"
          )

          if [ -n "${{ steps.paths.outputs.build_qml_dir }}" ]; then
            CMD+=("-qmldir=${{ steps.paths.outputs.build_qml_dir }}")
          fi

          "${CMD[@]}"

      - name: Inspect app bundle after deploy
        shell: bash
        run: |
          APP_PATH="${{ steps.paths.outputs.app_path }}"
          ls -la "$APP_PATH/Contents"
          ls -la "$APP_PATH/Contents/MacOS"
          ls -la "$APP_PATH/Contents/Frameworks"
          ls -la "$APP_PATH/Contents/PlugIns"
          ls -la "$APP_PATH/Contents/Resources"

      - name: Collect DMG
        shell: bash
        run: |
          mkdir -p dist
          find "$GITHUB_WORKSPACE/build" -name "*.dmg" -exec cp {} dist/ \;

      - name: Zip app bundle
        shell: bash
        run: |
          mkdir -p dist
          APP_PATH="${{ steps.paths.outputs.app_path }}"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/AMarinerControl.app.zip

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMarinerControl-macOS-DMG
          path: dist/*.dmg

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMarinerControl-macOS-app
          path: dist/AMarinerControl.app.zip
