name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts qtquick3d qt5compat qtlocation'
          cache: true

      - name: Install NSIS with Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          iwr -useb get.scoop.sh -outfile install.ps1
          .\install.ps1 -RunAsAdmin
          scoop update
          scoop bucket add extras
          scoop install nsis
          "$HOME\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify NSIS
        shell: pwsh
        run: |
          where.exe makensis
          makensis -VERSION

      - name: Configure CMake
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release

      - name: Package installer
        shell: pwsh
        run: .\scripts\build_windows_installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AMarinerControl-Setup
          path: dist\*.exe
